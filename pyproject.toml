[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orrery-source-monitor"
version = "0.1.0"
description = "Low-maintenance official-source monitors for The Orrery"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedgen>=1.0,<2",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "lxml>=5.2,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
orrery-monitor = "orrery_monitor.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
